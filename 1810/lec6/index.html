<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101828">
  <title>COMP1649 Lecture Reader</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="menu-btn" id="menuBtn" type="button" aria-label="Open slide list">☰</button>
    <div class="page-title">
      <div class="slide-no" id="slideNo">Slide</div>
      <div class="slide-name" id="slideName">Lecture Reader</div>
    </div>
    <div class="font-controls">
      <button class="icon-btn" id="fontDown" type="button" aria-label="Decrease font size">A−</button>
      <button class="icon-btn" id="fontUp" type="button" aria-label="Increase font size">A+</button>
    </div>
  </header>
  <main class="reader" id="reader">
    <article class="slide-shell">
      <div id="slideContent"><div class="loading">Loading slide…</div></div>
    </article>
  </main>
  <nav class="bottombar" aria-label="Slide navigation">
    <div class="nav-inner">
      <button class="nav-btn" id="prevBtn" type="button">← Previous</button>
      <div class="progress">
        <div class="progress-text" id="progressText">1/1</div>
        <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
      </div>
      <button class="nav-btn primary" id="nextBtn" type="button">Next →</button>
    </div>
  </nav>
</div>
<div class="backdrop" id="backdrop"></div>
<aside class="drawer" id="drawer">
  <div class="drawer-header">
    <a href="./index.html">back</a>
    <strong>Slides</strong>
    <button class="icon-btn" id="closeDrawer" type="button" aria-label="Close slide list">✕</button>
  </div>
  <div class="slide-list" id="slideList"></div>
</aside>
<script src="js/slides.js"></script>
<script src="js/app.js"></script>
</body>
</html>
