  <h1>Problems with Metaphors</h1>
</header>
<p class="lead">The lecture warns that metaphors can:</p>
<ul>
  <li>conflict with conventions;</li>
  <li>constrain designers;</li>
  <li>conflict with design principles;</li>
  <li>force users to interpret systems too literally;</li>
  <li>import flaws from existing systems;</li>
  <li>limit innovation.</li>
</ul>
